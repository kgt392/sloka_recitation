name: sloka_recitation
description: "A devotional app to recite, record, and organize sacred slokas and playlists."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0
  record: ^5.2.0
  path_provider: ^2.1.3
  file_picker: ^8.0.0
  share_plus: ^9.0.0
  shared_preferences: ^2.2.3
  archive: ^3.6.1
  receive_sharing_intent: ^1.4.8
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_platform_interface: 1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
